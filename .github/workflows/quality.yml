name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: php -l examples/php/get-verse.php
      - name: Validate JavaScript syntax
        run: node --check examples/javascript/get-verse.mjs
      - name: Validate shell syntax
        run: bash -n examples/curl/get-verse.sh
