name: Quality

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PHP syntax
        run: php -l examples/php/get-verse.php
      - name: Validate JavaScript syntax
        run: node --check examples/javascript/get-verse.mjs
      - name: Validate shell syntax
        run: bash -n examples/curl/get-verse.sh
      - name: Validate Python syntax
        run: python3 -m py_compile examples/python/get_verse.py tests/python_test.py
      - name: Run Python regression tests
        run: python3 -m unittest tests/python_test.py
